# ==================================================================
# ⚠️ LOKASI aaPanel: GUI -> Sites -> api.domain.sch.id -> Configuration
# Masukkan di bawah `#error_page 404/404.html;` (Di dalam blok server {})
# JANGAN mengubah baris SSL atau Root document bawaan aaPanel.
# ==================================================================

# ------------------------------------------------------------------
# PHASE D.2 - SECURITY HEADERS
# ------------------------------------------------------------------
# Menyembunyikan versi Nginx
server_tokens off;

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# Content-Security-Policy (Sangat ketat, hanya memperbolehkan self origin)
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss:;" always;

add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-site" always;
add_header Origin-Agent-Cluster "?1" always;
add_header X-DNS-Prefetch-Control "off" always;

# Menghilangkan Server Header secara penuh memerlukan Nginx kompilasi khusus (More Headers modul), 
# namun aaPanel default bisa menimpa dengan:
more_clear_headers 'Server'; 

# ------------------------------------------------------------------
# PHASE D.5 & D.6 - DDOS MITIGATION & LARGE FILE UPLOAD
# ------------------------------------------------------------------
# Mendukung upload PDF/Video guru hingga 2GB
client_max_body_size 2048m;

# Mencegah Slowloris Attack dengan mempercepat timeout body/header jika koneksi lambat
client_body_timeout 60s;
client_header_timeout 15s;
keepalive_timeout 65s;
send_timeout 30s;

# Ukuran buffer optimal untuk menampung request besar tanpa memenuhi disk
client_body_buffer_size 16M;
client_header_buffer_size 1k;
large_client_header_buffers 4 8k;

# Gzip Compression
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

# OCSP Stapling (Dikelola aaPanel saat Enable SSL -> Force HTTPS)
# ssl_stapling on;
# ssl_stapling_verify on;
