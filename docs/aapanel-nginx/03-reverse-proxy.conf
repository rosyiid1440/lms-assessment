# ==================================================================
# ⚠️ LOKASI aaPanel: GUI -> Sites -> api.domain.sch.id -> Reverse Proxy
# Buat Reverse Proxy baru:
#   Target URL: http://127.0.0.1:5000
#   Send Domain: $host
# Kemudian klik "Config" di proxy yang baru dibuat dan GANTIKAN isinya dengan ini.
# ==================================================================

# ------------------------------------------------------------------
# PHASE D.9 - HEALTH CHECK (EXPOSED)
# ------------------------------------------------------------------
location ^~ /health/ {
    proxy_pass http://127.0.0.1:5000/health/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    access_log off; # Jangan penuhi log dengan ping K8s/Docker/aaPanel
}

# ------------------------------------------------------------------
# PHASE D.4 - AUTHENTICATION RATE LIMITING
# ------------------------------------------------------------------
# Melindungi endpoint login/refresh/register dari serangan Brute Force
location ~ ^/api/v1/auth/(login|refresh|register|password/reset) {
    limit_req zone=auth_limit burst=5 nodelay;
    
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ------------------------------------------------------------------
# PHASE D.7 - CACHE STRATEGY (STATIC & UPLOADS)
# ------------------------------------------------------------------
location ^~ /storage/ {
    proxy_pass http://127.0.0.1:5000/storage/;
    
    # Matikan proxy buffering untuk unduhan besar agar RAM Nginx tidak habis
    proxy_buffering off;
    proxy_request_buffering off;
    
    # Cache Aggressive untuk file statis/upload
    expires max;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# ------------------------------------------------------------------
# PHASE D.1 & D.8 - MAIN API ROUTE (NO CACHE & WEBSOCKET)
# ------------------------------------------------------------------
location / {
    limit_req zone=api_global_limit burst=50 nodelay;
    
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # API No Cache Policy
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    expires off;

    # WebSocket & SSE Support (Phase D.8)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    
    # Timeout besar untuk upload tugas/video dari Guru (Phase D.6)
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    
    # Matikan request buffering agar Node.js langsung menerima aliran stream Multipart
    proxy_request_buffering off;
}
