components:
  schemas:
    ProblemDetails:
      type: object
      description: RFC 7807 Standardized Error Response
      properties:
        type:
          type: string
          format: uri
          description: A URI reference that identifies the problem type.
          example: "https://api.lms.local/errors/REQ_001"
        title:
          type: string
          description: A short, human-readable summary of the problem type.
          example: "Validation Failed"
        status:
          type: integer
          format: int32
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
          example: 400
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
          example: "One or more validation errors occurred."
        instance:
          type: string
          format: uri-reference
          description: A URI reference that identifies the specific occurrence of the problem.
          example: "/api/v1/users"
        correlationId:
          type: string
          format: uuid
          description: Unique identifier for distributed tracing.
        requestId:
          type: string
          format: uuid
          description: Unique identifier for the specific HTTP request.
        timestamp:
          type: string
          format: date-time
        errors:
          type: array
          description: Optional array of field-specific validation errors or metadata.
          items:
            type: object
            properties:
              field:
                type: string
                example: "email"
              message:
                type: string
                example: "Invalid email format"
