global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'lms-app'
    metrics_path: '/health/metrics'
    static_configs:
      - targets: ['app:5000']
    
  - job_name: 'lms-worker'
    metrics_path: '/health/metrics'
    static_configs:
      - targets: ['worker:5000']
